name: macOS notarization verification
run-name: macOS notarization verification · ${{ inputs.source_tag || 'disabled' }}

on:
  push:
    branches: [codex/native-client-shared]
    paths:
      - .github/workflows/macos-notarization-verify.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful formal release run containing the source artifacts
        type: string
        required: true
        default: '42474933687'
      source_tag:
        description: Tag that must resolve to the source run commit
        type: string
        required: true
        default: v1.1.4

      start_new:
        description: Explicitly approve starting a new app submission if no checkpoint exists
        type: boolean
        default: false
      resume_arm64_artifact_id:
        description: Verified pending checkpoint artifact ID for ARM64 (optional)
        type: string
        default: ''
      resume_x64_artifact_id:
        description: Verified pending checkpoint artifact ID for x64 (optional)
        type: string
        default: ''

permissions: {}

concurrency:
  group: macos-notary-verify-${{ inputs.source_run_id }}-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Notarize verification · ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Zolmid/FlClash' && github.repository_id == '1420254999' && github.ref == 'refs/heads/codex/native-client-shared' && vars.MACOS_NOTARIZATION_VERIFY_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    uses: ./.github/workflows/macos-notarization-pipeline.yml
    with:
      arch: ${{ matrix.arch }}
      source_run_id: ${{ inputs.source_run_id }}
      source_tag: ${{ inputs.source_tag }}
      start_new: ${{ inputs.start_new }}
      resume_artifact_id: ${{ inputs[format('resume_{0}_artifact_id', matrix.arch)] }}
