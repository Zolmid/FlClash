name: macOS notarization pipeline

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      official:
        type: boolean
        default: false
      source_run_id:
        type: string
        default: ''
      source_tag:
        type: string
        default: ''
      start_new:
        type: boolean
        default: false
      resume_artifact_id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  submit-app:
    name: macOS app · ${{ inputs.arch }}
    runs-on: xcode-27
    environment: macos-distribution
    timeout-minutes: 30
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 27.* ]]
      - name: Verify and perform app stage
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZATION_VERIFY_ENABLED: ${{ vars.MACOS_NOTARIZATION_VERIFY_ENABLED }}
          MACOS_SIGNING_REQUIRED: ${{ inputs.official }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8_BASE64: ${{ secrets.APPLE_ASC_P8_BASE64 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_ARCH: ${{ inputs.arch }}
          OFFICIAL: ${{ inputs.official }}
          START_NEW: ${{ inputs.start_new }}
          RESUME_ARTIFACT: ${{ inputs.resume_artifact_id }}
        run: >-
          python3 tool/client_release/macos_verify_run.py
          --source-run-id "$SOURCE_RUN_ID" --source-tag "$SOURCE_TAG" --arch "$SOURCE_ARCH"
          --official "$OFFICIAL" --start-new "$START_NEW" --resume-artifact-id "$RESUME_ARTIFACT"
          --mode app --output "$RUNNER_TEMP/macos-signed" --pending-output "$RUNNER_TEMP/macos-pending"
      - name: Retain exact signed checkpoint
        id: checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notary-checkpoint-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-app
          path: |
            ${{ runner.temp }}/macos-pending/pending-receipt.json
            ${{ runner.temp }}/macos-pending/notary-app.zip
            ${{ runner.temp }}/macos-pending/notary-dmg.dmg
          if-no-files-found: error
          retention-days: 7

  wait-app:
    name: Await Apple app acceptance · ${{ inputs.arch }}
    needs: submit-app
    runs-on: ubuntu-24.04
    environment: macos-distribution
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.submit-app.outputs.checkpoint }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-pending
      - name: Wait for accepted status without submitting
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8_BASE64: ${{ secrets.APPLE_ASC_P8_BASE64 }}
        run: node tool/client_release/macos_notary_wait.mjs "$RUNNER_TEMP/macos-pending" app

  submit-dmg:
    name: macOS dmg · ${{ inputs.arch }}
    needs: [wait-app, submit-app]
    runs-on: xcode-27
    environment: macos-distribution
    timeout-minutes: 30
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 27.* ]]
      - name: Verify and perform dmg stage
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZATION_VERIFY_ENABLED: ${{ vars.MACOS_NOTARIZATION_VERIFY_ENABLED }}
          MACOS_SIGNING_REQUIRED: ${{ inputs.official }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8_BASE64: ${{ secrets.APPLE_ASC_P8_BASE64 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_ARCH: ${{ inputs.arch }}
          OFFICIAL: ${{ inputs.official }}
          START_NEW: ${{ inputs.start_new }}
          RESUME_ARTIFACT: ${{ needs.submit-app.outputs.checkpoint }}
        run: >-
          python3 tool/client_release/macos_verify_run.py
          --source-run-id "$SOURCE_RUN_ID" --source-tag "$SOURCE_TAG" --arch "$SOURCE_ARCH"
          --official "$OFFICIAL" --start-new "$START_NEW" --resume-artifact-id "$RESUME_ARTIFACT"
          --mode dmg --output "$RUNNER_TEMP/macos-signed" --pending-output "$RUNNER_TEMP/macos-pending"
      - name: Retain exact signed checkpoint
        id: checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notary-checkpoint-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-dmg
          path: |
            ${{ runner.temp }}/macos-pending/pending-receipt.json
            ${{ runner.temp }}/macos-pending/notary-app.zip
            ${{ runner.temp }}/macos-pending/notary-dmg.dmg
          if-no-files-found: error
          retention-days: 7

  wait-dmg:
    name: Await Apple dmg acceptance · ${{ inputs.arch }}
    needs: submit-dmg
    runs-on: ubuntu-24.04
    environment: macos-distribution
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.submit-dmg.outputs.checkpoint }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-pending
      - name: Wait for accepted status without submitting
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8_BASE64: ${{ secrets.APPLE_ASC_P8_BASE64 }}
        run: node tool/client_release/macos_notary_wait.mjs "$RUNNER_TEMP/macos-pending" dmg

  finalize:
    name: macOS final · ${{ inputs.arch }}
    needs: [wait-dmg, submit-dmg]
    runs-on: xcode-27
    environment: macos-distribution
    timeout-minutes: 30
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 27.* ]]
      - name: Verify and perform final stage
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZATION_VERIFY_ENABLED: ${{ vars.MACOS_NOTARIZATION_VERIFY_ENABLED }}
          MACOS_SIGNING_REQUIRED: ${{ inputs.official }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8_BASE64: ${{ secrets.APPLE_ASC_P8_BASE64 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_ARCH: ${{ inputs.arch }}
          OFFICIAL: ${{ inputs.official }}
          START_NEW: ${{ inputs.start_new }}
          RESUME_ARTIFACT: ${{ needs.submit-dmg.outputs.checkpoint }}
        run: >-
          python3 tool/client_release/macos_verify_run.py
          --source-run-id "$SOURCE_RUN_ID" --source-tag "$SOURCE_TAG" --arch "$SOURCE_ARCH"
          --official "$OFFICIAL" --start-new "$START_NEW" --resume-artifact-id "$RESUME_ARTIFACT"
          --mode final --output "$RUNNER_TEMP/macos-signed" --pending-output "$RUNNER_TEMP/macos-pending"
      - name: Retain exact signed checkpoint
        id: checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notary-checkpoint-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            ${{ runner.temp }}/macos-pending/pending-receipt.json
            ${{ runner.temp }}/macos-pending/notary-app.zip
            ${{ runner.temp }}/macos-pending/notary-dmg.dmg
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified final DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.official && format('macos-distribution-{0}-{1}', inputs.arch, github.run_number) || format('macos-notarization-verification-{0}-{1}-{2}', inputs.arch, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/macos-signed/
          if-no-files-found: error
          retention-days: 7
