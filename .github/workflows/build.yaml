name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      deep_review:
        description: Run all supported CodeQL extractors in addition to the full CI checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      official_release:
        description: Run every check and render the formal release notes
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.official_release && 'official' || 'ordinary' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  BRANCH_CACHE: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  selection:
    permissions:
      contents: read
    name: Select CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      observe: ${{ steps.candidate.outputs.observe || 'false' }}
      profile: ${{ steps.select.outputs.profile }}
      dart: ${{ steps.select.outputs.dart }}
      plugins: ${{ steps.select.outputs.plugins }}
      go: ${{ steps.select.outputs.go }}
      android: ${{ steps.select.outputs.android }}
      rust: ${{ steps.select.outputs.rust }}
      windows_helper_test: ${{ steps.select.outputs.windows_helper_test }}
      desktop: ${{ steps.select.outputs.desktop }}
      apple_renewal: ${{ steps.select.outputs.apple_renewal || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OFFICIAL_INPUT: ${{ toJSON(inputs.official_release) }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            exec python3 -I tool/ci/select_checks.py
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] || {
            echo 'Invalid pull request base SHA' >&2
            exit 1
          }
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD)" == "$GITHUB_SHA" &&
             "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD^1)" == "$BASE_SHA" ]] || {
            echo 'Checkout does not match the pull request merge and base commits' >&2
            exit 1
          }
          entry=$(git -C "$GITHUB_WORKSPACE" ls-tree "$BASE_SHA^{tree}" -- tool/ci/select_checks.py)
          if [[ -z "$entry" ]]; then
            echo 'Base predates CI selection; running all checks.'
            {
              echo 'profile=full'
              for job in dart plugins go android rust windows_helper_test desktop; do echo "$job=true"; done
              echo "apple_renewal=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$entry" == '100644 blob '* || "$entry" == '100755 blob '* ]] || exit 1
          selector=$(mktemp "$RUNNER_TEMP/select-checks.XXXXXXXX")
          git -C "$GITHUB_WORKSPACE" show "$BASE_SHA:tool/ci/select_checks.py" > "$selector"
          python3 -I "$selector"
      - name: Set up Flutter for main changelog verification
        if: &docs_main github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private && steps.select.outputs.profile == 'docs'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
      - name: Verify changelog on main documentation changes
        if: *docs_main
        run: |
          flutter pub get --enforce-lockfile
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run tool/changelog.dart verify
      - id: candidate
        if: >-
          github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted &&
          github.repository == 'Zolmid/FlClash' && github.repository_id == '1420254999' && !inputs.official_release
        env:
          EVENT_DELETED: ${{ toJSON(github.event.deleted) }}
          OFFICIAL_INPUT: ${{ toJSON(inputs.official_release) }}
        run: python3 -I tool/ci/standard_ci_reuse.py --candidate >> "$GITHUB_OUTPUT"

  delegation:
    name: Standard CI delegation
    needs: selection
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.selection.outputs.observe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      delegated: ${{ steps.decide.outputs.delegated }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_DELETED: ${{ toJSON(github.event.deleted) }}
          OFFICIAL_INPUT: ${{ toJSON(inputs.official_release) }}
        run: python3 -I -u tool/ci/standard_ci_reuse.py

  review:
    uses: ./.github/workflows/repository-review.yml
    permissions:
      contents: read
    with:
      deep: ${{ inputs.official_release == true || inputs.deep_review == true }}

  dart:
    permissions:
      contents: read
    name: Dart
    needs: [delegation, selection]
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.dart == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Test release helpers
        run: |
          marker="release-helper-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          python3 -m unittest discover -s tool/client_release/tests -p '*_test.py'
          python3 -m unittest discover -s tool/ci/tests -p '*_test.py'
          echo "::$marker::"
          trap - EXIT
          node --test tool/client_release/tests/*_test.mjs

      - name: Setup Rust cache
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Check generated Dart sources
        run: dart run build_runner build --only-check

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Render formal release notes
        if: inputs.official_release
        run: dart run tool/changelog.dart render release --tag "$GITHUB_REF_NAME" --out release-notes.md

      - name: Upload formal release notes
        if: inputs.official_release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-release-notes-${{ github.run_number }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    permissions:
      contents: read
    needs: [delegation, selection]
    name: Plugins
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.plugins == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate ZolNit client module
        working-directory: packages/zolnit_client
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  apple-renewal:
    permissions:
      contents: read
    name: Apple renewal
    needs: [delegation, selection]
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.apple_renewal == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check iOS renewal transport
        run: |
          set -euo pipefail
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          sudo xcode-select -s /Applications/Xcode_27.1.app
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]] || exit 1
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash tool/acceptance/ios_intents/run_classifier.sh

  desktop:
    permissions:
      contents: read
    name: Desktop ${{ matrix.platform }}
    needs: selection
    if: ${{ !cancelled() && needs.selection.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sdk_ver=$(xcrun --sdk macosx --show-sdk-version)
          if [[ "$sdk_ver" != 27.* ]]; then
            echo "::error::Expected macOS SDK 27.x but got $sdk_ver"
            exit 1
          fi

      - name: Check iOS tunnel lifecycle
        if: matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !inputs.official_release
        timeout-minutes: 15
        run: |
          set -euo pipefail
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]] || exit 1
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          for check in race classifier completion abandon; do
            bash "tool/acceptance/ios_intents/run_${check}.sh"
          done
          bash tool/acceptance/ios_intents/check_sdk.sh

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install isolated Helper acceptance toolchain
        timeout-minutes: 5
        if: matrix.platform == 'windows' && github.ref == 'refs/heads/codex/native-client-shared'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw "Rust acceptance toolchain installation failed: $LASTEXITCODE" }
          rustup target add --toolchain 1.99.0 x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust acceptance target installation failed: $LASTEXITCODE" }

      - name: Run isolated Windows Helper acceptance
        timeout-minutes: 15
        if: matrix.platform == 'windows' && github.ref == 'refs/heads/codex/native-client-shared'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.99.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'zolnit-windows-helper-acceptance'
          $null = New-Item -ItemType Directory -Path $evidence -Force
          $result = 'failed'
          try {
            pwsh -NoLogo -NoProfile -NonInteractive -File .\tool\acceptance\windows_helper_architecture_test.ps1 *>&1 | Tee-Object -FilePath (Join-Path $evidence 'architecture-tests.log')
            if ($LASTEXITCODE -ne 0) { throw "Architecture contract failed: $LASTEXITCODE" }
            & .\tool\acceptance\windows_helper.ps1 *>&1 | Tee-Object -FilePath (Join-Path $evidence 'harness.log')
            if ($LASTEXITCODE -ne 0) { throw "Isolated Helper acceptance failed: $LASTEXITCODE" }
            $result = 'passed'
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $evidence 'harness.log') -Encoding utf8
            throw
          } finally {
            [ordered]@{
              source_commit = $env:GITHUB_SHA
              result = $result
              scope = 'CI Windows VM; owned Helper/Core/Job and dedicated frontend only'
              signed_ios_device = $false
              real_flutter_frontend = $false
              scm_service = $false
              production_http_ingress = $false
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'result.json') -Encoding utf8
          }

      - name: Upload isolated Windows Helper evidence
        if: always() && matrix.platform == 'windows' && github.ref == 'refs/heads/codex/native-client-shared'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-helper-isolated-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zolnit-windows-helper-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Build portable Windows acceptance packages
        timeout-minutes: 20
        if: matrix.platform == 'windows' && github.ref == 'refs/heads/codex/native-client-shared'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.99.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $env:RUNNER_TEMP 'zolnit-windows-acceptance-packages'
          $null = New-Item -ItemType Directory -Path $packages -Force
          try {
            foreach ($entry in @(@{ Name = 'x64'; Type = 'NativeX64' }, @{ Name = 'arm64'; Type = 'NativeArm64' })) {
              $directory = Join-Path $packages $entry.Name
              & .\tool\acceptance\windows_helper.ps1 -BuildOnly -ExecutionType $entry.Type -OutputDirectory $directory *>&1 | Tee-Object -FilePath (Join-Path $packages ($entry.Name + '-build.log'))
              if ($LASTEXITCODE -ne 0) { throw "Portable package build failed: $LASTEXITCODE" }
              $manifest = Get-Content -LiteralPath (Join-Path $directory 'manifest.json') -Raw | ConvertFrom-Json
              if ($manifest.executed -ne $false -or $manifest.classification -ne 'build-only' -or $manifest.source.commit -ne $env:GITHUB_SHA -or $manifest.source.dirty -ne $false) {
                throw 'Portable package provenance must match a clean checkout and remain build-only.'
              }
              Compress-Archive -Path "$directory/*" -DestinationPath (Join-Path $packages ('windows-helper-tools-' + $entry.Name + '.zip'))
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $packages 'package-error.log') -Encoding utf8
            throw
          }

      - name: Upload portable Windows acceptance packages
        if: always() && matrix.platform == 'windows' && github.ref == 'refs/heads/codex/native-client-shared'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-helper-tools-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zolnit-windows-acceptance-packages/*.zip
            ${{ runner.temp }}/zolnit-windows-acceptance-packages/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Compiles the desktop runners and the native plugin code that only the
      # tagged release matrix built before; the bundle itself is discarded.
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

      - name: Verify iOS startup configuration handoff
        if: matrix.platform == 'macos'
        timeout-minutes: 16
        run: flutter test --no-pub test/providers/ios_setup_handoff_test.dart

  go:
    permissions:
      contents: read
    needs: [delegation, selection]
    name: Go core
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./tun >&2
            exit 1
          }
          go test -count=1 . ./clientbundle ./cmd/zolnit-bundle-probe
          go test -count=1 -tags=zolnit_acceptance . ./cmd/zolnit-bundle-probe
          go vet . ./clientbundle ./cmd/...
          go vet -tags=zolnit_acceptance . ./cmd/zolnit-bundle-probe
          GOOS=linux go vet ./platform

      - name: Validate client routing selectors without network
        working-directory: core
        env:
          CGO_ENABLED: 0
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tempfile
          version = re.search(r'^core_version:\s*(\S+)', pathlib.Path('../build_config.yaml').read_text(), re.M).group(1)
          fixture = str(pathlib.Path('../test/fixtures/zolnit-routing-compiled.yaml').resolve())
          source = str(pathlib.Path('../test/core/zolnit_routing_offline_test.go').resolve())
          with tempfile.TemporaryDirectory(prefix='zolnit-core-') as work:
              binary = str(pathlib.Path(work) / 'routing.test')
              subprocess.run(['go', 'test', '-mod=readonly', '-c',
                              '-ldflags=-X github.com/metacubex/mihomo/constant.Version=' + version,
                              '-o', binary, source], check=True)
              subprocess.run(['sudo', '-n', 'unshare', '--net', '--', 'env',
                              'ZOLNIT_ROUTING_CONFIG=' + fixture, 'ZOLNIT_CORE_VERSION=' + version,
                              binary, '-test.run=^TestNativeRoutingOffline$', '-test.v', '-test.timeout=30s'],
                             check=True)
          PY

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    permissions:
      contents: read
    needs: [delegation, selection]
    name: Android unit tests
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare Android build inputs
        id: android-tools
        uses: ./.github/actions/android-check-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Run Android unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.android-tools.outputs.ndk-path }}
        run: bash tool/ci/android_unit.sh

  rust:
    permissions:
      contents: read
    needs: [delegation, selection]
    name: Rust
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Rust cache
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --locked --manifest-path services/helper/Cargo.toml
          cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    permissions:
      contents: read
    needs: [delegation, selection]
    name: Windows helper test
    if: ${{ !cancelled() && needs.delegation.outputs.delegated != 'true' && needs.selection.outputs.windows_helper_test == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Rust cache
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --locked --manifest-path services/helper/Cargo.toml --features windows-service

  ci-gate:
    permissions:
      contents: read
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'CI gate' || 'Build gate' }}
    if: ${{ always() }}
    needs: [delegation, selection, review, dart, plugins, go, android, rust, windows-helper-test, desktop, apple-renewal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          errors = []
          for job in ('selection', 'review'):
              if needs[job]['result'] != 'success':
                  errors.append(f"{job}: {needs[job]['result']}")
          outputs = needs['selection'].get('outputs', {})
          observe = outputs.get('observe')
          observer = needs['delegation']
          delegated = observer.get('outputs', {}).get('delegated')
          if observe == 'true':
              if observer['result'] != 'success' or delegated not in ('true', 'false'):
                  errors.append(f"formal observer: {observer['result']}, delegated={delegated}")
          elif observe != 'false' or observer['result'] != 'skipped' or delegated:
              errors.append('unexpected formal observer state')
          for job in ('dart', 'plugins', 'go', 'android', 'rust', 'windows-helper-test', 'desktop', 'apple-renewal'):
              selected = outputs.get(job.replace('-', '_'))
              if selected not in ('true', 'false'):
                  errors.append(f'{job}: invalid selection')
                  continue
              expected = selected == 'true' and (job == 'desktop' or delegated != 'true')
              actual = needs[job]['result']
              if actual != ('success' if expected else 'skipped'):
                  errors.append(f'{job}: {actual}, expected {"success" if expected else "skipped"}')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('All selected CI checks passed.')
          PY

  build:
    permissions:
      contents: read
    # A skipped observer is normal upstream. Packaging still requires six local successes.
    if: >-
      !cancelled() && github.repository == 'chen08209/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.ci-gate.result == 'success' && needs.dart.result == 'success' && needs.plugins.result == 'success' &&
      needs.go.result == 'success' && needs.android.result == 'success' && needs.rust.result == 'success' &&
      needs.windows-helper-test.result == 'success'
    needs: [ci-gate, dart, plugins, go, android, rust, windows-helper-test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: xcode-27
            arch: amd64
            flutter-arch: x64
          - platform: macos
            os: xcode-27
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prefetch pinned Gradle distribution
        if: startsWith(matrix.platform,'android')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/ci/prefetch_gradle.py --install-kotlin-compiler-mirror

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter-arch || '' }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sdk_ver=$(xcrun --sdk macosx --show-sdk-version)
          if [[ "$sdk_ver" != 27.* ]]; then
            echo "::error::Expected macOS SDK 27.x but got $sdk_ver"
            exit 1
          fi

      - name: Install Rosetta for Intel cross-build
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 true
          echo "FLUTTER_XCODE_ARCHS=x86_64" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 x86_64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get --enforce-lockfile

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # Reviewed hash pins the CA roots shared by the Core and Dart.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Verify macOS binary architecture
        if: startsWith(matrix.platform,'macos')
        run: |
          config=Release
          if [[ "${{ env.IS_STABLE }}" != true ]]; then config=Release; fi
          bash tool/ci/verify_macos_arch.sh "$config" "${{ matrix.arch }}"

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    # The standalone upstream publisher inherits its repository permissions.
    if: >-
      !cancelled() && github.repository == 'chen08209/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api@sha256:e71b78c32ac7d6a56a127f8bb432aaa9cb0055fda37c3ef79d2b1b0723eadf70
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$IS_STABLE" == 'true' ]]; then
            target=(--tag "$TAG")
          else
            dart run tool/changelog.dart build --unreleased
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md
          dart run tool/changelog.dart render telegram "${target[@]}" --out telegram.md

      - name: Push to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python release_telegram.py

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: ./dist/*
          body_path: './release.md'

      - name: Create Homebrew Cask Source Dir
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          arm_sha=$(sha256sum "./dist/FlClash-${version}-macos-arm64.dmg" | awk '{print $1}')
          amd_sha=$(sha256sum "./dist/FlClash-${version}-macos-amd64.dmg" | awk '{print $1}')

          mkdir -p ./brew/Casks
          sed \
            -e "s|VERSION|$version|g" \
            -e "s|ARM_SHA256|$arm_sha|g" \
            -e "s|AMD_SHA256|$amd_sha|g" \
            ./.github/homebrew_cask_template.rb > ./brew/Casks/flclash.rb

      - name: Push to Homebrew tap
        if: ${{ env.IS_STABLE == 'true' }}
        uses: cpina/github-action-push-to-another-repository@07c4d7b3def0a8ebe788a8f2c843a4e1de4f6900 # v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
        with:
          source-directory: ./brew/
          destination-github-username: chen08209
          destination-repository-name: homebrew-tap
          user-name: 'chen08029'
          user-email: 'chen08209@gmail.com'
          target-branch: main
          commit-message: Update Homebrew cask from ${{ github.ref_name }}
          target-directory: /

      - name: Create Fdroid Source Dir
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          mkdir -p ./tmp
          cp ./dist/*android-arm64-v8a* ./tmp/ || true
          echo "Files copied successfully"

      - name: Push to fdroid repo
        if: ${{ env.IS_STABLE == 'true' }}
        uses: cpina/github-action-push-to-another-repository@07c4d7b3def0a8ebe788a8f2c843a4e1de4f6900 # v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: ./tmp/
          destination-github-username: chen08209
          destination-repository-name: FlClash-fdroid-repo
          user-name: 'chen08029'
          user-email: 'chen08209@gmail.com'
          target-branch: main
          commit-message: Update from ${{ github.ref_name }}
          target-directory: /tmp/
