name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tool/build_site.sh'
      - 'tool/render_site.mjs'
      - '.github/workflows/pages.yaml'
  workflow_run:
    workflows:
      - build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tag:
    # head_branch also names a branch push's branch, so only a tag at the built commit counts as a release.
    if: >-
      github.repository == 'chen08209/FlClash' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.lookup.outputs.stable }}
    steps:
      - name: Look up the tag
        id: lookup
        env:
          NAME: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if git ls-remote --tags "$REMOTE" "refs/tags/$NAME" "refs/tags/$NAME^{}" | grep -q "^$SHA"; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: tag
    permissions:
      contents: read
      pages: write
      id-token: write
    if: >-
      github.repository == 'chen08209/FlClash' &&
      !cancelled() &&
      (github.event_name != 'workflow_run' || needs.tag.outputs.stable == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/build_site.sh _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
