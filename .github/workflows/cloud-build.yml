name: Cloud build
run-name: Cloud build · ${{ github.event_name == 'push' && (github.ref == 'refs/heads/codex/ios-support' && 'ios' || 'all') || inputs.platform || 'all' }} · iOS ${{ github.event_name == 'push' && 'project' || inputs.ios_source || 'project' }}

on:
  push:
    branches: [main, codex/patched-integration, codex/ios-support, codex/upstream-0.9.1, codex/zolnit-client, codex/native-client-shared]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to compile
        type: choice
        required: true
        default: all
        options: [all, macos, windows, android, ios, linux]
      ios_source:
        description: iOS source (project builds this branch)
        type: choice
        required: true
        default: project
        options: [project, patched-reference]
      android_release:
        description: Android release APK (requires ZOLNIT_ANDROID_* secrets)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  ZOLNIT_NATIVE_UI: ${{ github.ref == 'refs/heads/codex/native-client-shared' && 'true' || 'false' }}
  ZOLNIT_CLIENT_BUNDLE: ${{ github.ref == 'refs/heads/codex/native-client-shared' && 'true' || 'false' }}

concurrency:
  group: cloud-build-${{ github.ref }}-${{ github.event_name == 'push' && (github.ref == 'refs/heads/codex/ios-support' && 'ios' || 'all') || inputs.platform || 'all' }}-${{ github.event_name == 'push' && 'project' || inputs.ios_source || 'project' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
      platform: ${{ steps.select.outputs.platform }}
      ios_source: ${{ steps.select.outputs.ios_source }}
      android_release: ${{ steps.select.outputs.android_release }}
    env:
      PLATFORM: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/codex/ios-support' && 'ios' || 'all') || inputs.platform || 'all' }}
      IOS_SOURCE: ${{ github.event_name == 'push' && 'project' || inputs.ios_source || 'project' }}
      CLIENT_BRANCH: ${{ github.ref == 'refs/heads/codex/zolnit-client' || github.ref == 'refs/heads/codex/native-client-shared' }}
      ANDROID_RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.android_release }}
      ANDROID_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.android_release && (github.ref == 'refs/heads/codex/zolnit-client' || github.ref == 'refs/heads/codex/native-client-shared') }}
    steps:
      - id: select
        run: |
          node <<'JS'
          const fs = require('fs');
          if (process.env.ANDROID_RELEASE_REQUESTED === 'true' &&
              (process.env.CLIENT_BRANCH !== 'true' || !['all', 'android'].includes(process.env.PLATFORM))) {
            throw new Error('Android release requires a client branch and an Android target');
          }
          const targets = [
            {platform: 'linux', os: 'ubuntu-22.04', arch: 'x64'},
            {platform: 'windows', os: 'windows-2022', arch: 'x64'},
            {platform: 'android', os: 'ubuntu-24.04', arch: 'arm64'},
            {platform: 'macos', os: 'xcode-27', arch: 'arm64'},
            {platform: 'macos', os: 'xcode-27', arch: 'x64', flutter_arch: 'x64'},
          ].map(t => ({...t, safe_preview: false}))
            .filter(t => process.env.PLATFORM === 'all' || t.platform === process.env.PLATFORM);
          if (process.env.CLIENT_BRANCH === 'true' && ['all', 'macos'].includes(process.env.PLATFORM)) {
            targets.push({platform: 'macos', os: 'xcode-27', arch: 'arm64', safe_preview: true});
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `platform=${process.env.PLATFORM}\nios_source=${process.env.IOS_SOURCE}\nandroid_release=${process.env.ANDROID_RELEASE === 'true'}\nmatrix=${JSON.stringify({include: targets})}\nenabled=${targets.length > 0}\n`);
          JS

  project:
    name: FlClash · ${{ matrix.platform }} · ${{ matrix.arch }}${{ matrix.safe_preview && ' · safe debug' || '' }}
    needs: select
    if: needs.select.outputs.enabled == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: '3.47.6'
      GO_VERSION: '1.27.1'
      RUSTUP_TOOLCHAIN: '1.99.0'
      GOTOOLCHAIN: local
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CLIENT_SAFE_PREVIEW: ${{ matrix.safe_preview }}
      CLIENT_BRANCH: ${{ github.ref == 'refs/heads/codex/zolnit-client' || github.ref == 'refs/heads/codex/native-client-shared' }}
      ANDROID_RELEASE: ${{ needs.select.outputs.android_release }}
      ZOLNIT_DISTRIBUTION: ${{ (github.ref == 'refs/heads/codex/zolnit-client' || github.ref == 'refs/heads/codex/native-client-shared') && 'direct' || '' }}
      CLIENT_BUILD_ENV: ${{ (github.ref == 'refs/heads/codex/zolnit-client' || github.ref == 'refs/heads/codex/native-client-shared') && 'stable' || 'dev' }}
    steps:
      - name: Enable Windows long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          if [[ "$TARGET_PLATFORM" == android ]]; then
            rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-linux-android
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.safe_preview && '-safe-debug' || '' }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_arch || '' }}
          cache: true

      - name: Install Linux libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Select Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sdk_ver=$(xcrun --sdk macosx --show-sdk-version)
          if [[ "$sdk_ver" != 27.* ]]; then
            echo "::error::Expected macOS SDK 27.x but got $sdk_ver"
            exit 1
          fi

      - name: Install Rosetta for Intel cross-build
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 true
          echo "FLUTTER_XCODE_ARCHS=x86_64" >> "$GITHUB_ENV"
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-apple-darwin

      - name: Preserve Intel macOS rendering workaround
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Read package version
        if: env.CLIENT_BRANCH == 'true' && !matrix.safe_preview
        id: version
        run: |
          ver=$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)
          if [[ ! "$ver" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Website packages require a stable semantic version'
            exit 1
          fi
          echo "package=$ver" >> "$GITHUB_OUTPUT"

      - name: Validate native Apple surface contract
        if: matrix.platform == 'macos' && matrix.safe_preview && env.ZOLNIT_NATIVE_UI == 'true'
        run: |
          flutter test test/views/zolnit/native_home_test.dart --dart-define=ZOLNIT_NATIVE_UI=true --dart-define=SAFE_MODE=true
          swift test --package-path plugins/zolnit_native_ui/darwin

      - name: Compile desktop
        if: matrix.platform != 'android'
        run: |
          if [[ "$CLIENT_SAFE_PREVIEW" == true ]]; then
            flutter build macos --debug --dart-define=APP_ENV=dev --dart-define=SAFE_MODE=true --dart-define=ZOLNIT_DISTRIBUTION=direct --dart-define=ZOLNIT_NATIVE_UI="$ZOLNIT_NATIVE_UI" --dart-define=ZOLNIT_CLIENT_BUNDLE="$ZOLNIT_CLIENT_BUNDLE"
          else
            flutter build "$TARGET_PLATFORM" --release --dart-define=APP_ENV="$CLIENT_BUILD_ENV" --dart-define=ZOLNIT_DISTRIBUTION="$ZOLNIT_DISTRIBUTION" --dart-define=ZOLNIT_NATIVE_UI="$ZOLNIT_NATIVE_UI" --dart-define=ZOLNIT_CLIENT_BUNDLE="$ZOLNIT_CLIENT_BUNDLE"
          fi

      - name: Compile Windows installer for validation
        if: matrix.platform == 'windows'
        working-directory: windows/packaging/exe/test
        run: |
          dart pub get --enforce-lockfile
          if [[ "$CLIENT_BRANCH" == true ]]; then
            dart run bin/compile_installer.dart --retain
          else
            dart run bin/compile_installer.dart
          fi

      - name: Provision Android release signing
        if: matrix.platform == 'android' && env.ANDROID_RELEASE == 'true'
        env:
          ZOLNIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZOLNIT_ANDROID_KEYSTORE_BASE64 }}
          ZOLNIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZOLNIT_ANDROID_KEYSTORE_PASSWORD }}
          ZOLNIT_ANDROID_KEY_ALIAS: ${{ secrets.ZOLNIT_ANDROID_KEY_ALIAS }}
          ZOLNIT_ANDROID_KEY_PASSWORD: ${{ secrets.ZOLNIT_ANDROID_KEY_PASSWORD }}
        run: |
          for var in ZOLNIT_ANDROID_KEYSTORE_BASE64 ZOLNIT_ANDROID_KEYSTORE_PASSWORD ZOLNIT_ANDROID_KEY_ALIAS ZOLNIT_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Required secret $var is not configured"
              exit 1
            fi
          done
          signing_dir=$(mktemp -d "$RUNNER_TEMP/zolnit-signing-XXXXXX")
          echo "ZOLNIT_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"
          (umask 077 && printenv ZOLNIT_ANDROID_KEYSTORE_BASE64 | base64 -d > "$signing_dir/release.keystore")
          if [[ ! -s "$signing_dir/release.keystore" ]]; then
            echo '::error::Decoded keystore is empty'
            exit 1
          fi
          echo "ZOLNIT_ANDROID_KEYSTORE_PATH=$signing_dir/release.keystore" >> "$GITHUB_ENV"

      - name: Compile Android
        if: matrix.platform == 'android' && env.ANDROID_RELEASE != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=APP_ENV=dev --dart-define=ZOLNIT_DISTRIBUTION="$ZOLNIT_DISTRIBUTION" --dart-define=ZOLNIT_NATIVE_UI="$ZOLNIT_NATIVE_UI" --dart-define=ZOLNIT_CLIENT_BUNDLE="$ZOLNIT_CLIENT_BUNDLE"

      - name: Reject Android release without dedicated signing
        if: matrix.platform == 'android' && env.ANDROID_RELEASE != 'true'
        working-directory: android
        run: |
          log=$(mktemp "$RUNNER_TEMP/zolnit-signing-check-XXXXXX")
          trap 'rm -f "$log"' EXIT
          if env -u ZOLNIT_ANDROID_KEYSTORE_PATH -u ZOLNIT_ANDROID_KEYSTORE_PASSWORD -u ZOLNIT_ANDROID_KEY_ALIAS -u ZOLNIT_ANDROID_KEY_PASSWORD ./gradlew :app:releaseGuard -Ptarget-platform=android-arm64 > "$log" 2>&1; then
            echo '::error::Missing release signing was unexpectedly accepted'
            exit 1
          fi
          if ! grep -Fq 'Release signing requires ZOLNIT_ANDROID_KEYSTORE_PATH' "$log"; then
            cat "$log"
            exit 1
          fi

      - name: Compile Android release
        if: matrix.platform == 'android' && env.ANDROID_RELEASE == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ZOLNIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZOLNIT_ANDROID_KEYSTORE_PASSWORD }}
          ZOLNIT_ANDROID_KEY_ALIAS: ${{ secrets.ZOLNIT_ANDROID_KEY_ALIAS }}
          ZOLNIT_ANDROID_KEY_PASSWORD: ${{ secrets.ZOLNIT_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ ! -f "$ZOLNIT_ANDROID_KEYSTORE_PATH" ]]; then
            echo '::error::Signing keystore not found; provision step may have failed'
            exit 1
          fi
          flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=stable --dart-define=ZOLNIT_DISTRIBUTION="$ZOLNIT_DISTRIBUTION" --dart-define=ZOLNIT_NATIVE_UI="$ZOLNIT_NATIVE_UI" --dart-define=ZOLNIT_CLIENT_BUNDLE="$ZOLNIT_CLIENT_BUNDLE"

      - name: Test native Android contract
        if: matrix.platform == 'android' && env.ZOLNIT_NATIVE_UI == 'true'
        working-directory: android
        run: ./gradlew :zolnit_native_ui:testDebugUnitTest -Ptarget-platform=android-arm64

      - name: Test system proxy ownership
        if: matrix.platform == 'windows'
        run: |
          cmake -S plugins/proxy/test/native -B build/proxy-ownership-tests
          cmake --build build/proxy-ownership-tests --config Release
          ctest --test-dir build/proxy-ownership-tests -C Release --output-on-failure

      - name: Test Windows tray menus
        if: matrix.platform == 'windows'
        run: |
          cmake -S plugins/tray/test/native -B build/tray-menu-tests
          cmake --build build/tray-menu-tests --config Release
          ctest --test-dir build/tray-menu-tests -C Release --output-on-failure

      - name: Test Windows autostart cleanup ownership
        if: matrix.platform == 'windows'
        run: |
          cmake -S windows/runner/test -B build/autostart-cleanup-tests
          cmake --build build/autostart-cleanup-tests --config Release
          ctest --test-dir build/autostart-cleanup-tests -C Release --output-on-failure

      - name: Archive Linux bundle
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/FlClash-linux-x64-release.tar.gz .

      - name: Create canonical Linux portable
        if: matrix.platform == 'linux' && env.CLIENT_BRANCH == 'true'
        run: |
          pkg="${{ steps.version.outputs.package }}"
          (cd build/linux/x64/release/bundle && zip -ryq "$GITHUB_WORKSPACE/dist/ZolNit-${pkg}-linux-x64.zip" .)

      - name: Archive macOS app
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          if [[ "$CLIENT_SAFE_PREVIEW" == true ]]; then
            ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Debug/ZolNit.app "dist/ZolNit-macos-$TARGET_ARCH-debug-safe.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ZolNit.app "dist/FlClash-macos-$TARGET_ARCH-release.zip"
          fi

      - name: Create canonical macOS DMG
        if: matrix.platform == 'macos' && env.CLIENT_BRANCH == 'true' && !matrix.safe_preview
        run: |
          pkg="${{ steps.version.outputs.package }}"
          staging=$(mktemp -d "${RUNNER_TEMP}/zolnit-dmg-XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          ditto build/macos/Build/Products/Release/ZolNit.app "$staging/ZolNit.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname ZolNit -srcfolder "$staging" -format UDZO "dist/ZolNit-${pkg}-macos-$TARGET_ARCH.dmg"
          hdiutil verify "dist/ZolNit-${pkg}-macos-$TARGET_ARCH.dmg"

      - name: Archive Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/FlClash-windows-x64-release.zip

      - name: Create canonical Windows portable
        if: matrix.platform == 'windows' && env.CLIENT_BRANCH == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/FlClash-windows-x64-release.zip "dist/ZolNit-${{ steps.version.outputs.package }}-windows-x64.zip"

      - name: Collect Android APK
        if: matrix.platform == 'android'
        run: |
          mkdir -p dist
          if [[ "$ANDROID_RELEASE" == true ]]; then
            pkg="${{ steps.version.outputs.package }}"
            apk=build/app/outputs/flutter-apk/app-release.apk
            if [[ ! -f "$apk" ]]; then
              echo '::error::Release APK was not produced'
              exit 1
            fi
            build_tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" > dist/apk-signing-report.txt 2>&1
            if ! grep -q 'Verified using' dist/apk-signing-report.txt; then
              echo '::error::Release APK failed signature verification'
              exit 1
            fi
            "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt" 2>&1
            badging="$RUNNER_TEMP/apk-badging.txt"
            if grep -q 'application-debuggable' "$badging"; then
              echo '::error::Release APK is marked debuggable'
              exit 1
            fi
            apk_pkg=$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" "$badging")
            apk_ver=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" "$badging")
            if [[ "$apk_pkg" != 'com.zolmid.zolnit' ]]; then
              echo "::error::APK package is '$apk_pkg', expected 'com.zolmid.zolnit'"
              exit 1
            fi
            if [[ "$apk_ver" != "$pkg" ]]; then
              echo "::error::APK versionName is '$apk_ver', expected '$pkg'"
              exit 1
            fi
            cp "$apk" "dist/ZolNit-${pkg}-android-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/FlClash-android-arm64-development.apk
          fi

      - name: Clean Android signing material
        if: always() && matrix.platform == 'android' && env.ANDROID_RELEASE == 'true'
        run: |
          if [[ "${ZOLNIT_SIGNING_DIR:-}" == "$RUNNER_TEMP"/zolnit-signing-* && -d "$ZOLNIT_SIGNING_DIR" ]]; then
            rm -rf -- "$ZOLNIT_SIGNING_DIR"
          fi

      - name: Record source and toolchain
        run: |
          compiled_env="$CLIENT_BUILD_ENV"
          if [[ "$CLIENT_SAFE_PREVIEW" == true || ( "$TARGET_PLATFORM" == android && "$ANDROID_RELEASE" != true ) ]]; then
            compiled_env=dev
          fi
          {
            echo "source_repository=$GITHUB_REPOSITORY"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "target=$TARGET_PLATFORM-$TARGET_ARCH"
            echo "client_safe_preview=$CLIENT_SAFE_PREVIEW"
            echo "native_ui=$ZOLNIT_NATIVE_UI"
            echo "client_bundle=$ZOLNIT_CLIENT_BUNDLE"
            echo "distribution_channel=$ZOLNIT_DISTRIBUTION"
            echo "client_build_env=$compiled_env"
            if [[ "$CLIENT_SAFE_PREVIEW" == true ]]; then
              echo 'client_defines=APP_ENV=dev;SAFE_MODE=true;ZOLNIT_DISTRIBUTION=direct'
            elif [[ -n "$ZOLNIT_DISTRIBUTION" ]]; then
              echo "client_defines=APP_ENV=$compiled_env;ZOLNIT_DISTRIBUTION=$ZOLNIT_DISTRIBUTION"
            fi
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [[ "$TARGET_PLATFORM" == android && "$ANDROID_RELEASE" == true ]]; then
              echo 'distribution=Android signed release candidate; not published'
            else
              echo 'distribution=development artifact; no production signing or notarization'
            fi
            git submodule status --recursive
            flutter --version
            go version
            rustc --version
          } > dist/source-provenance.txt
          node <<'JS'
          const fs = require('fs'), crypto = require('crypto');
          const files = fs.readdirSync('dist').filter(f => f !== 'SHA256SUMS').sort();
          fs.writeFileSync('dist/SHA256SUMS', files.map(f =>
            crypto.createHash('sha256').update(fs.readFileSync(`dist/${f}`)).digest('hex') + '  ' + f
          ).join('\n') + '\n');
          JS

      - name: Verify macOS binary architecture
        if: matrix.platform == 'macos'
        run: |
          config=${{ matrix.safe_preview && 'Debug' || 'Release' }}
          bash tool/ci/verify_macos_arch.sh "$config" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: flclash-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.safe_preview && '-safe-debug' || '' }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS · ${{ needs.select.outputs.ios_source }} · unsigned arm64
    needs: select
    if: needs.select.outputs.platform == 'all' || needs.select.outputs.platform == 'ios'
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IOS_SOURCE: ${{ needs.select.outputs.ios_source }}
      IOS_OBSERVER_ACCEPTANCE: ${{ github.ref == 'refs/heads/codex/native-client-shared' && needs.select.outputs.ios_source == 'project' }}
      IOS_ACCEPTANCE_BUNDLE_ID: com.zolmid.zolnit.debug
      FLUTTER_VERSION: ${{ needs.select.outputs.ios_source == 'patched-reference' && '3.47.7' || '3.47.6' }}
      GO_VERSION: ${{ needs.select.outputs.ios_source == 'patched-reference' && '1.26.8' || '1.27.1' }}
      RUSTUP_TOOLCHAIN: '1.99.0'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout project
        if: env.IOS_SOURCE == 'project'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned Patched reference
        if: env.IOS_SOURCE == 'patched-reference'
        uses: actions/checkout@v4
        with:
          repository: chenx-dust/FlClash-Patched
          ref: 7ea4597c9182d40cd57da9fc2f2d5cc0a5f84c2f
          submodules: recursive
          persist-credentials: false

      - name: Check iOS implementation
        run: |
          if [[ ! -f ios/Runner.xcodeproj/project.pbxproj || ! -f ios/NECore/PacketTunnelProvider.swift ]]; then
            echo '::error::The selected source is missing the iOS Runner or Packet Tunnel target.'
            exit 1
          fi
          if [[ "$IOS_SOURCE" == patched-reference ]]; then
            test "$(git rev-parse HEAD)" = 7ea4597c9182d40cd57da9fc2f2d5cc0a5f84c2f
          fi

      - name: Fetch Patched core version history
        if: env.IOS_SOURCE == 'patched-reference'
        run: |
          if [[ "$(git -C core/mihomo rev-parse --is-shallow-repository)" == true ]]; then
            git -C core/mihomo fetch --unshallow --tags origin
          else
            git -C core/mihomo fetch --tags origin
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sdk_ver=$(xcrun --sdk macosx --show-sdk-version)
          if [[ "$sdk_ver" != 27.* ]]; then
            echo "::error::Expected macOS SDK 27.x but got $sdk_ver"
            exit 1
          fi
          ios_sdk_ver=$(xcrun --sdk iphoneos --show-sdk-version)
          if [[ "$ios_sdk_ver" != 27.* ]]; then
            echo "::error::Expected iOS SDK 27.x but got $ios_sdk_ver"
            exit 1
          fi

      - name: Build and validate unsigned iOS lease observer
        timeout-minutes: 15
        if: github.ref == 'refs/heads/codex/native-client-shared' && env.IOS_SOURCE == 'project'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/zolnit-ios-lease-observer"
          mkdir -p "$evidence"
          python3 - <<'PYMETA'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zolnit-ios-lease-observer/context.json'
          path.write_text(json.dumps({'source_commit': os.environ['GITHUB_SHA'],
              'scope': 'CI macOS runner; unsigned iOS arm64 observer build only',
              'signed_ios_device': False, 'real_flutter_frontend': False, 'scm_service': False}) + '\n')
          PYMETA
          python3 -m unittest discover -s test/core/ios -p '*_test.py' -v 2>&1 | tee "$evidence/contracts.log"
          xcrun swiftc ios/Shared/RoutingLeaseObservationReader.swift ios/LeaseObserver/LeaseObservationPresentation.swift test/core/ios/lease_observer_presentation.swift -o "$evidence/presentation-check"
          "$evidence/presentation-check" 2>&1 | tee "$evidence/presentation.log"
          python3 tool/acceptance/build_ios_observer.py --app-bundle-id "$IOS_ACCEPTANCE_BUNDLE_ID" --output "$evidence/unsigned" 2>&1 | tee "$evidence/build-result.json"
          xcrun lipo -archs "$evidence/unsigned/Payload/ZolNitLeaseObserver.app/ZolNitLeaseObserver" | tee "$evidence/architectures.log"
          test "$(cat "$evidence/architectures.log")" = arm64
          python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib, plistlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zolnit-ios-lease-observer'
          result = json.loads((root / 'build-result.json').read_text())
          assert result['ok'] is True and result['code'] == 'ios_observer_unsigned_build'
          assert result['source_commit'] == os.environ['GITHUB_SHA'] and result['working_tree_dirty'] is False
          assert result['signed'] is False and result['device_executed'] is False
          ipa = root / 'unsigned/ZolNitLeaseObserver-unsigned.ipa'
          assert ipa.stat().st_size > 0 and hashlib.sha256(ipa.read_bytes()).hexdigest() == result['ipa_sha256']
          with zipfile.ZipFile(ipa) as bundle:
              assert bundle.testzip() is None
              prefix = 'Payload/ZolNitLeaseObserver.app/'
              info = plistlib.loads(bundle.read(prefix + 'Info.plist'))
              assert info['CFBundleIdentifier'] == os.environ['IOS_ACCEPTANCE_BUNDLE_ID'] + '.LeaseObserver'
              assert info['ZolNitObserverAppGroup'] == 'group.' + os.environ['IOS_ACCEPTANCE_BUNDLE_ID']
              assert hashlib.sha256(bundle.read(prefix + info['CFBundleExecutable'])).hexdigest() == result['executable_sha256']
              assert not any('/_CodeSignature/' in name or name.endswith('/embedded.mobileprovision') for name in bundle.namelist())
          PYVERIFY

      - name: Upload unsigned iOS lease observer evidence
        if: always() && github.ref == 'refs/heads/codex/native-client-shared' && env.IOS_SOURCE == 'project'
        uses: actions/upload-artifact@v4
        with:
          name: ios-lease-observer-arm64-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zolnit-ios-lease-observer/*.json
            ${{ runner.temp }}/zolnit-ios-lease-observer/*.log
            ${{ runner.temp }}/zolnit-ios-lease-observer/unsigned/ZolNitLeaseObserver-unsigned.ipa
            ${{ runner.temp }}/zolnit-ios-lease-observer/unsigned/xcodebuild.log
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Install Rust iOS target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud-ios-${{ env.IOS_SOURCE }}
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile unsigned device IPA
        run: |
          set -euo pipefail
          if [[ "$IOS_OBSERVER_ACCEPTANCE" == true ]]; then
            ZOLNIT_ROUTING_OBSERVATION=true dart setup.dart ios --env dev --ios-bundle-id "$IOS_ACCEPTANCE_BUNDLE_ID" --no-codesign -v
          else
            dart setup.dart ios --env dev --no-codesign -v
          fi

      - name: Collect IPA and provenance
        run: |
          shopt -s nullglob
          ipas=(dist/*-ios-arm64-unsigned.ipa)
          if (( ${#ipas[@]} == 0 )); then
            echo '::error::No unsigned arm64 IPA was produced.'
            exit 1
          fi
          mkdir -p cloud-artifacts
          cp "${ipas[@]}" cloud-artifacts/
          if [[ "$IOS_OBSERVER_ACCEPTANCE" == true ]]; then
            test "${#ipas[@]}" -eq 1
            python3 tool/acceptance/validate_ios_pair.py --client "${ipas[0]}" --observer "$RUNNER_TEMP/zolnit-ios-lease-observer/unsigned/ZolNitLeaseObserver-unsigned.ipa" --base-bundle-id "$IOS_ACCEPTANCE_BUNDLE_ID" --source-commit "$GITHUB_SHA" > cloud-artifacts/acceptance-pair.json
          fi
          source_repo="$GITHUB_REPOSITORY"
          if [[ "$IOS_SOURCE" == patched-reference ]]; then
            source_repo=chenx-dust/FlClash-Patched
          fi
          {
            echo "source_kind=$IOS_SOURCE"
            echo "source_repository=$source_repo"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_repository=$GITHUB_REPOSITORY"
            echo "workflow_commit=$GITHUB_SHA"
            echo "native_ui=$ZOLNIT_NATIVE_UI"
            echo "client_bundle=$ZOLNIT_CLIENT_BUNDLE"
            echo "routing_observation=$IOS_OBSERVER_ACCEPTANCE"
            if [[ "$IOS_OBSERVER_ACCEPTANCE" == true ]]; then
              echo "app_bundle_id=$IOS_ACCEPTANCE_BUNDLE_ID"
              echo "observer_bundle_id=$IOS_ACCEPTANCE_BUNDLE_ID.LeaseObserver"
              echo "app_group=group.$IOS_ACCEPTANCE_BUNDLE_ID"
            fi
            echo 'target=iOS arm64 physical device; simulator unsupported'
            echo 'signing=ad hoc unsigned IPA; requires provisioning for device installation'
            git submodule status --recursive
            flutter --version
            go version
            rustc --version
            xcodebuild -version
          } > cloud-artifacts/source-provenance.txt
          (cd cloud-artifacts && shasum -a 256 ./* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.IOS_SOURCE }}-arm64-unsigned-${{ github.run_number }}
          path: cloud-artifacts/
          if-no-files-found: error
          retention-days: 14
