name: Scheduled security audit

on:
  schedule:
    - cron: '19 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    uses: ./.github/workflows/repository-review.yml
    with:
      inventory: true
      deep: true

  security-tab:
    name: Publish scheduled analysis
    if: github.event_name == 'schedule' && github.repository == 'Zolmid/FlClash' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: codeql-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/sarif
