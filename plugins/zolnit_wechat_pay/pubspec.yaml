name: zolnit_wechat_pay
description: Android Stripe WeChatPay SDK bridge for ZolNit.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.zolnit.payments
        pluginClass: ZolnitWechatPayPlugin
